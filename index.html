<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Omniverse Presentation</title>
    <meta name="description" content="An interactive presentation about NVIDIA Omniverse">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <img src="logo/omniverse-logo.png" alt="NVIDIA Omniverse Logo" class="logo">
            <h1>NVIDIA Omniverse</h1>
        </div>
        <div class="header-right">
            <div class="author-info">
                <div class="author-name">Varun A. Sridhar</div>
                <div class="author-details">
                    <span>Columbia University</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <!-- Slide 0 -->
            <section id="home" class="slide-layout-normal">
                <div class="section-content">
                    <div class="slide-layout">
                        <div class="slide-text">
                            <div class="slide-heading">
                                <h2 id="slide0-heading">Loading...</h2>
                            </div>
                            <div class="slide-content" id="slide0-content">
                                <p>Loading content...</p>
                            </div>
                        </div>
                        <div class="slide-image">
                            <img src="slides/slide0.png" alt="Slide 0 Image">
                        </div>
                    </div>
                </div>
            </section>
            <!-- --- -->

            <!-- Slide 1 -->
            <section id="overview" class="slide-layout-reverse">
                <div class="section-content">
                    <div class="slide-layout">
                        <div class="slide-text">
                            <div class="slide-heading">
                                <h2 id="slide1-heading">Loading...</h2>
                            </div>
                            <div class="slide-content" id="slide1-content">
                                <p>Loading content...</p>
                            </div>
                        </div>
                        <div class="slide-image">
                            <img id="slide1-image" src="slides/slide1-a.png" alt="Slide 1 Image (click to toggle)" data-alt-src="slides/slide1-b.png">
                            <div id="slide1-hint" class="click-hint">click!</div>
                        </div>
                    </div>
                </div>
            </section>
            <!-- --- -->

            <!-- Slide 2 -->
            <section id="features" class="slide-layout-normal">
                <div class="section-content">
                    <div class="slide-layout">
                        <div class="slide-text">
                            <div class="slide-heading">
                                <h2>Key Features</h2>
                            </div>
                            <div class="slide-content">
                                <p>Add your content here...</p>
                            </div>
                        </div>
                        <div class="slide-image">
                            <img src="slides/dummy slide img.png" alt="Slide Image">
                        </div>
                    </div>
                </div>
            </section>
            <!-- --- -->

            <!-- Slide 3 -->
            <section id="demo" class="slide-layout-reverse">
                <div class="section-content">
                    <div class="slide-layout">
                        <div class="slide-text">
                            <div class="slide-heading">
                                <h2>Interactive Demo</h2>
                            </div>
                            <div class="slide-content">
                                <p>Add your content here...</p>
                            </div>
                        </div>
                        <div class="slide-image">
                            <img src="slides/dummy slide img.png" alt="Slide Image">
                        </div>
                    </div>
                </div>
            </section>
            <!-- --- -->
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Omniverse Presentation</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
